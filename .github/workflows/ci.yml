name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: TypeScript type-check ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ccd-school

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artifacts/ccd-school/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

  # ── Job 2: Unit tests (Vitest) ────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ccd-school

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artifacts/ccd-school/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: artifacts/ccd-school/coverage/

  # ── Job 3: Next.js build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ccd-school
    env:
      # Dummy env vars so Next.js build doesn't fail on missing secrets
      DATABASE_URL: postgresql://dummy:dummy@localhost/dummy
      AUTH_SECRET: ci-dummy-secret-32chars-minimum-ok
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_POSTHOG_KEY: ""
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artifacts/ccd-school/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        # Build is informational for now — don't fail the whole CI on it
        # (requires real DB connection for some features)
        continue-on-error: true

  # ── Job 4: Lint / format check ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/ccd-school

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artifacts/ccd-school/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for TypeScript errors (strict)
        run: npm run typecheck
