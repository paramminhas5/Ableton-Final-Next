[package]
name = "ccd-engine"
version = "0.1.0"
edition = "2021"
description = "CCD School sound engine: clock, sequencer, instruments, parameter registry. Real-time safe."
license = "UNLICENSED"
publish = false

[lib]
name = "ccd_engine"
# engine-wasm wraps this as a cdylib; the Tauri app links it directly.
crate-type = ["rlib"]

[[bin]]
name = "gen-types"
path = "src/bin/gen_types.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
