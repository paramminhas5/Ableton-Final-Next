kind = "web"
previewPath = "/"
title = "CCD.SCHOOL — Learn Music Production & DJing"
version = "1.0.0"
id = "artifacts/ccd-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24094

[services.development]
run = "pnpm --filter @workspace/ccd-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ccd-school", "run", "build" ]
publicDir = "artifacts/ccd-school/.next/standalone"
serve = "static"

[services.env]
PORT = "24094"
BASE_PATH = "/"
