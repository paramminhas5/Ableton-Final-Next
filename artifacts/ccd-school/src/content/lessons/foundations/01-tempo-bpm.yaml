slug: tempo-bpm
world: foundations
number: 1
title: pulse and tempo
minutes: 6
song:
  adds: drums.kick
  why: every song starts with a pulse, and yours starts with a kick you play in yourself, at a speed you choose
learn: >-
  The steady beat under every dance track, how fast it goes, and the first sound in your own song: a kick
  you play in and set to your own tempo.
youCan:
  - feel the pulse of a track and count along with it
  - play a kick in on the beat
  - say what bpm means and roughly what speed house and techno sit at
  - set your song's tempo by ear
steps:
  - kind: hear
    clip: kick-alone
    say:
      mentor: >-
        Hear that thump? That's a kick drum, and it's playing the pulse: a steady beat that never speeds up or
        slows down. Every dance track you've ever moved to has one underneath it. It's the thing your foot
        taps to without asking.

        Your song is going to start right here, with a pulse of your own.
      straight: >-
        This is a kick drum playing the pulse: one hit on every beat, perfectly even. Every dance track is
        built on a pulse like this. Your song starts with one.
      eli5: >-
        Boom, boom, boom, boom. That's a kick drum. It's like a heartbeat for music: it goes at the same speed
        the whole time. When you tap your foot to a song, you're tapping to this.

        Your song is going to start with a boom like this.

  - kind: say
    title: count along
    clip: kick-alone
    say:
      mentor: >-
        Count with it, out loud if you can: one, two, three, four, then start again at one. Each kick is a
        beat. The pulse is just beats in a row.

        Musicians count in fours almost all the time, because it's easy to feel and easy to dance to. You'll
        hear why that matters in the next lesson.
      straight: >-
        Each kick is one beat. Count one to four and start again. Dance music almost always counts in fours.
      eli5: >-
        Let's count the booms: one, two, three, four, and again, one, two, three, four. Every boom is called a
        beat. Musicians love counting to four.

  - kind: play
    layer: drums
    surface: pads
    goal: {notes: 4, note: kick}
    say:
      mentor: >-
        Now play the pulse yourself. This bar becomes the first thing in your song.

        Press rec. You'll hear four clicks to count you in, so just listen. Then tap the kick pad once on each
        of the next four clicks. Any kick that lands early or late turns red, and you can play it again. Tap
        undo to take one back, hold it to start over.
      straight: >-
        Record the pulse. Press rec, wait out four clicks, then tap the kick on each of the next four. Red means
        off the beat; undo takes one back, hold clears.
      eli5: >-
        Your turn! Press the red rec button. Let four ticks go by, then tap the kick pad on every tick, four
        times. If a tap is too early or too late it goes red, so you can try that one again.

  - kind: tempo
    marks: [100, 120, 128, 140]
    say:
      mentor: >-
        That's your kick, looping. Now turn the knob and listen to what happens.

        How fast the pulse goes is called the tempo, and it's counted in bpm: beats per minute. At 120 bpm
        there are two beats every second. Turn it down and everything feels heavier and lazier. Turn it up
        and it gets urgent. House usually lives around 120 to 128, techno a bit faster, garage and dubstep
        around 140.

        Try the four speeds on the right, then pick the one that feels like your song. You can change it any
        time later.
      straight: >-
        This is your kick at different speeds. Tempo is measured in bpm, beats per minute: 120 bpm is two
        beats a second. House sits around 120 to 128, techno a little higher, garage and dubstep near 140.
        Pick a tempo for your song.
      eli5: >-
        Turn the big knob and listen: your kick goes faster or slower. How fast the booms come is called the
        tempo. We count it in bpm, which means booms per minute. 120 bpm is two booms every second.

        Slow feels sleepy and heavy. Fast feels exciting. Pick the speed you like best for your song.
    hint: The number is how many kicks you'd hear in one minute.

  - kind: say
    title: your pulse
    say:
      mentor: >-
        So your song now has a pulse: a kick on every beat, at a tempo you chose. Everything you add from here
        lines up with it. The hats, the bass, the melody, all of it counts along with this kick.

        Producers set the tempo first because changing it later changes how everything feels. A tune that's
        cheeky at 128 can sound sad at 100.
      straight: >-
        Your song has a pulse and a tempo. Everything you add later is timed against it, which is why the
        tempo usually gets set first.
      eli5: >-
        Now your song has a heartbeat, and you picked how fast it goes. Every sound you add later will dance
        along to it.
    deeper:
      - title: why 120 to 128 for house
        say: >-
          It's close to a brisk walking pace, which is about as fast as people can dance to for hours without
          getting tired. Early Chicago house sat around 120. Techno from Detroit and Berlin pushed faster.
      - title: half time
        say: >-
          Dubstep is 140 bpm, but it often feels like 70, because the big drums only hit on every other beat.
          The pulse is still 140 underneath. You'll hear the same trick in a lot of trap and drum and bass.

  - kind: ask
    q: What does bpm stand for?
    options: ["beats per minute", "bars per minute", "beats per measure", "bass per minute"]
    answer: 0
    why: Beats per minute. 120 bpm means 120 beats, 120 kicks here, in one minute.
    whyWrong:
      1: A bar is a group of beats. Tempo counts the beats themselves.
      2: Close, but it's per minute. That's what makes it a speed.
      3: It's beats, the steady pulse you counted along with.

  - kind: ask
    q: At 120 bpm, how many beats happen every second?
    options: ["two", "one", "four", "twelve"]
    answer: 0
    why: 120 beats in 60 seconds is two every second.
    whyWrong:
      1: One a second would be 60 bpm, half your song's speed.
      2: Four a second would be 240 bpm, far faster than any house track.
      3: Twelve a second would be a buzz, not a beat.

  - kind: ask
    q: Hear your kick at 120 bpm, then at 140. What happens to it?
    part: kick
    play: [{bpm: 120, label: "120 bpm"}, {bpm: 140, label: "140 bpm"}]
    options: ["the kicks come closer together", "the kick gets louder", "the kick gets higher in pitch", "you get more kicks in each bar"]
    answer: 0
    why: Same pattern, played faster. Each beat is shorter, so the kicks arrive sooner.
    whyWrong:
      1: Tempo changes speed, not volume.
      2: The kick sounds the same, it just comes round more often.
      3: Still one kick per beat. There are just more beats in each minute.

  - kind: ask
    q: Which of these is at a house tempo?
    sounds: [{bpm: 124}, {bpm: 70}, {bpm: 175}]
    options: ["120 to 128 bpm", "60 to 80 bpm", "170 to 180 bpm"]
    answer: 0
    why: House usually sits between 120 and 128. Techno goes a little faster.
    whyWrong:
      1: That's ballad speed, slower than most dance music.
      2: That's drum and bass territory.

  - kind: ask
    q: Why does the click play while you record?
    options: ["so you have something to play along to", "it becomes part of your song", "to make the kick louder", "to count how many kicks you played"]
    answer: 0
    why: The click is a guide to keep you on the beat. It never goes into your song.
    whyWrong:
      1: The click stays out of your song. Only your kicks go in.
      2: It doesn't touch the kick at all.
      3: It just ticks on every beat.

  - kind: ask
    more: true
    q: One of these is your kick at 60 bpm. Which one?
    part: kick
    sounds: [{bpm: 60}, {bpm: 120}, {bpm: 90}]
    options: ["60 bpm, one beat every second", "120 bpm, a beat every half second", "90 bpm, three beats every two seconds"]
    answer: 0
    why: 60 beats in 60 seconds, so one beat every second.
    whyWrong:
      1: "That's twice as fast: two kicks every second."
      2: Close, but the kicks come a little quicker than once a second.

  - kind: ask
    more: true
    q: Why do producers usually set the tempo first?
    options: ["changing it later changes how everything feels", "you can't change it later", "the kick only works at one tempo", "bpm sets how loud the song is"]
    answer: 0
    why: Every part is played against the pulse. Change the speed and the whole mood shifts with it.
    whyWrong:
      1: You can change it any time. It just changes the feel of everything already there.
      2: A kick works at any tempo.
      3: Tempo is speed, not loudness.

  - kind: ask
    more: true
    q: Dubstep is 140 bpm but often feels like 70. Why?
    options: ["the big drums hit on every other beat", "it's played slower in clubs", "the bass is out of time", "dubstep has no pulse"]
    answer: 0
    why: Half time. The pulse is still 140, but the heavy drums skip every other beat, so it feels half as fast.
    whyWrong:
      1: Clubs play it at 140.
      2: The bass is right on the grid, it just leaves space.
      3: There's always a pulse underneath.

  - kind: keep
    next: >-
      Next: bars and counting. A clap on two and four turns your pulse into a groove, and your loop grows to
      four bars.
