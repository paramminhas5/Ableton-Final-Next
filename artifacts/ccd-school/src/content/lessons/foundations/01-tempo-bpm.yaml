slug: tempo-bpm
world: foundations
number: 1
title: your pulse
minutes: 4
song:
  adds: drums.kick
  why: every song starts with a pulse, and yours starts with a kick you play in yourself
learn: >-
  The steady beat under every dance track, and the first sound in your own song: a kick you play in
  yourself, on the beat.
youCan:
  - feel the pulse of a track and count along with it
  - play a kick in on the beat
steps:
  - kind: hear
    clip: kick-alone
    say:
      mentor: >-
        Hear that thump? That's a kick drum, and it's playing the pulse: a steady beat that never speeds up or
        slows down. Every dance track you've ever moved to has one underneath it. It's the thing your foot
        taps to without asking.

        Your song is going to start right here, with a pulse of your own.
      straight: >-
        This is a kick drum playing the pulse: one hit on every beat, perfectly even. Every dance track is
        built on a pulse like this. Your song starts with one.
      eli5: >-
        Boom, boom, boom, boom. That's a kick drum. It's like a heartbeat for music: it goes at the same speed
        the whole time. When you tap your foot to a song, you're tapping to this.

        Your song is going to start with a boom like this.

  - kind: say
    title: count along
    clip: kick-alone
    say:
      mentor: >-
        Count with it, out loud if you can: one, two, three, four, then back to one. Each kick is one beat,
        and the pulse is just beats in a row.

        Every time you get back to one, a new bar starts. A bar is a group of beats, and in almost all dance
        music it's four beats long. That's what "4/4" means, said "four four": four beats in every bar. The
        screen counts the bars for you as they go past, bar 1, bar 2.

        Bars are how musicians find their way around a song, the way sentences are made of words: "the bass
        comes in after eight bars". From here on, everything you make is built in bars of four.
      straight: >-
        Each kick is one beat. Four beats make a bar, so you count one to four and start again at one. Four
        beats per bar is written 4/4, said "four four", and nearly all dance music is in 4/4. Songs are
        measured in bars.
      eli5: >-
        Let's count the booms: one, two, three, four, and back to one. Every boom is a beat. Four beats
        together make a bar, like four steps make one little dance move. When you get back to one, a new
        bar starts. Music that counts in fours like this is called "four four".

  - kind: say
    title: the click
    clip: click
    say:
      mentor: >-
        Before you play, meet the click. It's a metronome: a tick on every beat, at exactly the speed of the
        song. The higher tick is beat one, where each count of four starts. The three lower ticks are two,
        three and four.

        When you record, the click plays four times first to count you in, then keeps going so you have
        something steady to play along with. It's only a guide. It never goes into your song.

        If it's too loud, make it quieter or turn it off. Whatever you pick is kept for every lesson.
      straight: >-
        This is the click, a metronome. One tick per beat: high on beat one, low on two, three and four. It
        counts you in before you record and keeps time while you play. It never goes into your song. Make it
        quieter or turn it off here.
      eli5: >-
        Tick, tick, tick, tick. That's the click. It's like a clock that keeps the beat for you. The high tick
        means "one, start counting again". It helps you play at the right time, and nobody hears it in your
        song but you.

  - kind: play
    why: >-
      This bar is the first thing in your song. Everything you add later lines up with it.
    layer: drums
    surface: pads
    goal: {notes: 4, note: kick}
    say:
      mentor: >-
        Now play the pulse yourself. This bar becomes the first thing in your song.

        Press rec. You'll hear four clicks to count you in, so just listen. Then tap the kick pad once on each
        of the next four clicks. Any kick that lands early or late turns red, and you can play it again. Tap
        undo to take one back, hold it to start over.
      straight: >-
        Record the pulse. Press rec, wait out four clicks, then tap the kick on each of the next four. Red means
        off the beat; undo takes one back, hold clears.
      eli5: >-
        Your turn! Press the red rec button. Let four ticks go by, then tap the kick pad on every tick, four
        times. If a tap is too early or too late it goes red, so you can try that one again.

  - kind: say
    title: your pulse
    say:
      mentor: >-
        So your song now has a pulse: a kick on every beat. Everything you add from here lines up with it.
        The hats, the bass, the melody, all of it counts along with this kick.

        Next you'll choose how fast it goes.
      straight: >-
        Your song has a pulse. Everything you add later is timed against it. Next: how fast it goes.
      eli5: >-
        Now your song has a heartbeat. Every sound you add later will dance along to it. Next you'll pick how
        fast it goes.

  - kind: ask
    q: Why does the click play while you record?
    options: ["so you have something to play along to", "it becomes part of your song", "to make the kick louder", "to count how many kicks you played"]
    answer: 0
    why: The click is a guide to keep you on the beat. It never goes into your song.
    whyWrong:
      1: The click stays out of your song. Only your kicks go in.
      2: It doesn't touch the kick at all.
      3: It just ticks on every beat.

  - kind: ask
    q: What is the pulse?
    options: ["a steady beat that doesn't speed up or slow down", "the loudest sound in a track", "the tune you hum along to", "how long the track lasts"]
    answer: 0
    why: The pulse is beats in a row, evenly spaced. It's what your foot taps to.
    whyWrong:
      1: Loud or quiet, the pulse is about timing, not volume.
      2: The tune sits on top of the pulse. The pulse is the beat underneath.
      3: It's about the beat, not the length.

  - kind: keep
    next: >-
      Next: tempo. Turn one knob and hear your kick get lazy or urgent, then pick the speed for your song.
