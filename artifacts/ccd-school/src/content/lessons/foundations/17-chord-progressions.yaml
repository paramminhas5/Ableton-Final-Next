slug: chord-progressions
world: foundations
number: 17
title: chord progressions
minutes: 7
song:
  changes: chords.chords
  why: chords that move in a good order carry the listener through the song
learn: >-
  How chords move from one to the next, the progressions behind countless songs, and four chords in your
  song.
youCan:
  - say what a chord progression is
  - play a four chord progression
  - hear which chord feels like home
steps:
  - kind: hear
    clip: synth-pitch
    say:
      mentor: >-
        A chord progression is just chords in an order. Some orders feel like a journey: away from home and
        back again. Four chords, round and round, is the backbone of a huge amount of pop and dance music.
      straight: >-
        A progression is a sequence of chords. Four chords looping is the backbone of most pop and dance
        tracks.
      eli5: >-
        Chords in a row make a progression, like a little journey. Most songs use four chords going round and
        round.

  - kind: say
    title: home and away
    say:
      mentor: >-
        Your i chord is home. Every other chord pulls a little away from it, and the progression feels
        satisfying when it comes back. In minor, a classic is i, VI, III, VII: home, then three steps that
        each feel like they're heading somewhere, then home again on the loop.

        You've heard it in countless tracks. Once you know it, you'll hear it everywhere.
      straight: >-
        i is home. Others pull away. In minor, i VI III VII is a classic four chord loop.
      eli5: >-
        The first chord is home. The others go on an adventure. Then the loop brings you home again. Try i,
        VI, III, VII.
    deeper:
      - title: four chords everywhere
        say: >-
          The same four chords, in major or minor order, sit under an enormous number of hits. Producers
          don't worry about that: the sound, rhythm and melody on top are what make a track yours.

  - kind: imagine
    layer: chords
    pattern: "1+3+5 - - - 4,+6,+1 - - - 6,+1+3 - - - 5,+7,+2 - - -"
    say:
      mentor: >-
        Four chords on the grid, no sound. Each stack is one chord; watch where the lowest note of each stack
        moves. Hear the first one in your head, then imagine the stack moving down, down again, then up a
        little. Then play the progressions and pick the one you saw.
      straight: >-
        Read the four chords, imagine them, then pick the matching progression. Watch the lowest note of each
        stack.
      eli5: >-
        Each stack of squares is one chord. Look at where the bottom square goes: down, down, up. Imagine it,
        then pick the one that sounds like that.
    hint: "Listen for the bottom note of each chord. Here it goes down, down again, then up."

  - kind: copy
    layer: chords
    pattern: "1+3+5 - - - 6,+1+3 - - - 4,+6,+1 - - - 5,+7,+2 - - -"
    say: >-
      Copy this progression by ear: four chords, one per beat. Work out the lowest note of each chord first, then fill in the rest.
    hint: "The lowest notes go root, down, down, up."

  - kind: play
    layer: chords
    surface: pads
    goal: {notes: 4, on: different}
    say:
      mentor: >-
        Play a four chord progression into your song, one chord on each beat. Start on i, then try VI, III and
        VII, or any order you like. Listen for which one makes you want to go back to i.
      straight: >-
        Record four chords, one per beat, starting on i. Try i VI III VII or your own order.
      eli5: >-
        Press rec. Play four chord pads, one on each tick. Start with i, then try VI, III and VII.

  - kind: tempo
    set: chords
    say:
      mentor: >-
        Now write the progression down for the whole song, the way Logic's Chord Track does: one chord per
        bar, each with its name (am, f, c, g) and its roman numeral in your key. Tap a bar, then a chord, or
        tap a progression to fill all four bars. Your chords part plays it as you go.

        From now on your bass, lead and chord pads light the notes of the chord under the playhead in the
        studio, so you always know which notes fit. FL Studio's chord progression tool and Live 12's chord
        tools do the same job.
      straight: >-
        A chord track: one chord per bar, named, with its numeral. Tap a bar then a chord, or pick a
        progression. Your chords part plays it, and the studio lights its notes on bass and lead.
      eli5: >-
        Pick a chord for each bar. Your chords play them. Later, the studio lights up the notes that fit.
    hint: >-
      Try i VI III VII first, then swap one bar for another chord and listen.

  - kind: ask
    q: What is a chord progression?
    options: ["chords played in an order", "a scale", "a single loud chord", "a drum fill"]
    answer: 0
    why: A sequence of chords, often looped.
    whyWrong:
      1: A scale is single notes.
      2: One chord isn't a progression.
      3: Fills are drums.

  - kind: ask
    q: Which of these progressions ends on the chord that feels like home?
    part: chords
    sounds: [{notes: "6,+1+3 - - - 4,+6,+1 - - - 5,+7,+2 - - - 1+3+5 - - -"}, {notes: "1+3+5 - - - 6,+1+3 - - - 4,+6,+1 - - - 7,+2+4 - - -"}]
    options: ["the one ending on i, the first chord", "the one ending on VII"]
    answer: 0
    why: The chord built on the first note of the scale is home.
    whyWrong:
      1: VII pulls back toward i.

  - kind: ask
    q: How many chords are in a lot of pop and dance loops?
    options: ["four", "one", "twelve", "twenty"]
    answer: 0
    why: Four chords, round and round, is the most common loop.
    whyWrong:
      1: One chord can work, but it's not a progression.
      2: Twelve would be very busy.
      3: That's a lot for a loop.

  - kind: keep
    next: >-
      Next: bass follows the chords. Root notes under your progression.
