slug: note-values
world: foundations
number: 3
title: subdivision
minutes: 7
song:
  adds: hats.hats
  why: hats fill the space between your kicks, and how finely you split the beat sets how busy the groove feels
learn: >-
  Splitting the beat into halves and quarters, eighths and sixteenths, and a hat pattern in your song that
  uses them. This is also where snap comes in.
youCan:
  - hear the difference between quarters, eighths and sixteenths
  - play hats on the eighths or sixteenths with snap on
  - say what snap does and when to turn it off
steps:
  - kind: hear
    clip: subdivisions
    say:
      mentor: >-
        Tap through the three. Same kick each time, but the hats split each beat differently.

        Quarters: one hat per beat, right on the kick. Eighths: two per beat, one on the kick and one exactly
        halfway to the next. Sixteenths: four per beat, a fast tick-tick-tick-tick. Listen to how the groove
        gets busier and faster-feeling while the tempo stays exactly the same.
      straight: >-
        Three ways to split the beat with a hi hat: quarters (one per beat), eighths (two), sixteenths
        (four). The tempo never changes, only how finely the beat is cut.
      eli5: >-
        Tap a, b and c. The boom stays the same. The tiny tss sound changes. One tss per boom, then two, then
        four really quick ones. More tss makes it feel busier, but the song isn't going any faster.

  - kind: say
    title: half a beat
    show:
      steps: 8
      ticks: true
      rows:
        - {name: kick, sound: kick, pattern: "x.x.x.x."}
        - {name: hats, sound: closed, pattern: ".x.x.x.x"}
      marks: [{at: 0, word: beat}, {at: 1, word: half}]
      caption: "Each beat split in two. Count: one and two and three and four and."
    say:
      mentor: >-
        Cut one beat exactly in half and you get two pieces. Musicians call each piece an eighth note,
        because eight of them fit in a bar of four beats.

        Count them by saying "and" between the numbers: one and two and three and four and. In the picture
        the kick sits on the numbers and the hat on every "and". Listen to the soft ticks: they mark every
        eighth, so you can hear the counting as well as see it.
      straight: >-
        Half a beat is an eighth note: eight fit in a bar. Count "one and two and". The kick is on the
        numbers, the hat on every "and".
      eli5: >-
        Take one beat and cut it in half, like a sandwich. Now there are two little pieces in every beat.
        Say "one and two and": the numbers are the boom, the "and" is the tss.

  - kind: say
    title: a quarter of a beat
    show:
      steps: 16
      ticks: true
      rows:
        - {name: kick, sound: kick, pattern: "x...x...x...x..."}
        - {name: hats, sound: closed, pattern: "xxxxxxxxxxxxxxxx"}
      caption: "Each beat split in four. Count: one e and a, two e and a."
    say:
      mentor: >-
        Cut each half in half again and every beat has four pieces. Each one is a sixteenth note, because
        sixteen fit in a bar.

        Count them as "one e and a, two e and a". The number is the beat, the "and" is still exactly halfway,
        and the "e" and "a" sit either side of it. Say it over the picture as it plays and you'll feel the hats
        lock to your voice.

        The tempo never changes in any of this. The beat is just cut more finely, so the groove feels busier
        and faster while your foot taps at the same speed.
      straight: >-
        A quarter of a beat is a sixteenth note: sixteen in a bar. Count "one e and a". The tempo stays the
        same; the beat is just cut finer, so it feels busier.
      eli5: >-
        Now cut each beat into four tiny pieces. Say "one e and a, two e and a" really quickly. That's four
        tss sounds for every boom, but the boom still goes at the same speed.
    deeper:
      - title: why the names are fractions
        say: >-
          A bar of 4/4 holds one whole note. Cut it in four and you get quarter notes, which are the beats. Cut
          it in eight and you get eighths, in sixteen and you get sixteenths. Sheet music draws each one
          differently, but on a producer's grid they're just the lines getting closer together.

  - kind: play
    why: >-
      Hats between the kicks fill the gaps, so the beat keeps moving instead of stopping and starting.
    layer: hats
    surface: pads
    snap: true
    goal: {notes: 4, note: hat, on: and}
    say:
      mentor: >-
        Now put hats in your song: one on every "and", halfway between your kicks. That's the classic house
        hat.

        Press show me to watch it once, then press rec, wait out the four clicks, and tap the hat on each
        "and". After your take, the screen zooms in on every hit so you can see how close it was: a little
        early, a little late or right on it.
      straight: >-
        Record a hat on every "and", between the kicks. Watch it once with show me, then rec. After the take
        you'll see how close each hit was.
      eli5: >-
        Your turn to add the tss. Watch first with show me. Then press rec, wait for four ticks, and tap the
        hat in the gap between each boom, on every "and".
    hint: Say "one and two and" and tap on every "and".

  - kind: say
    title: snap
    say:
      mentor: >-
        Nobody taps exactly on the grid, and the zoomed view showed you by how much. That's what snap is
        for. Snap, also called quantise, moves every hit to the nearest line on the grid, so a hat that was
        a few milliseconds late lands exactly on the "and". If you pressed grid after your take, that's what
        it did. Live, FL Studio and Logic all have it.

        It's brilliant for drums that need to be tight, like hats and kicks in a club track. But a little
        looseness is what makes a groove feel human, so producers often snap a part, then nudge a few hits
        back off the grid on purpose. You'll do that in the swing lesson.
      straight: >-
        Snap (quantise) moves hits to the nearest grid line. Use it for tight drums; leave some hits loose
        when you want a human feel.
      eli5: >-
        Snap is like a magnet that pulls your taps onto the lines, so they line up neatly. Sometimes a bit of
        wobble sounds more alive, and then you leave the magnet off.
    deeper:
      - title: in your daw · quantise
        say: >-
          Every music program can snap notes you've played to the grid. Pick yours to see how.

  - kind: ask
    q: "These are sixteenth hats over your kick. Count the hats from one kick to the next: how many sixteenths fit
      in one beat?"
    part: hats
    with: ["kick"]
    play: {notes: {hat: "xxxxxxxxxxxxxxxx"}}
    options: ["four", "two", "sixteen", "eight"]
    answer: 0
    why: A sixteenth is a quarter of a beat, so four fit in one beat and sixteen in a bar.
    whyWrong:
      1: Two per beat is eighths.
      2: Sixteen fit in a whole bar of four beats.
      3: Eight per beat would be thirty-second notes.

  - kind: ask
    q: Hear your hats as eighths, then as sixteenths. What happens to the tempo?
    part: hats
    with: ["kick"]
    play: [{notes: {hat: "x.x.x.x.x.x.x.x."}, label: "eighths"}, {notes: {hat: "xxxxxxxxxxxxxxxx"}, label: "sixteenths"}]
    options: ["it stays the same", "it doubles", "it halves", "it goes up a little"]
    answer: 0
    why: The pulse doesn't change. The beat is just cut into smaller pieces, so it feels busier.
    whyWrong:
      1: The kick keeps the same speed. Only the hats get busier.
      2: Nothing slows down. There are just more hats in each beat.
      3: Tempo only changes when you turn the tempo knob.

  - kind: ask
    q: What does snap do to a hit that's slightly early?
    options: ["moves it to the nearest grid line", "deletes it", "makes it louder", "moves it to the start of the bar"]
    answer: 0
    why: Snap pulls each hit onto the nearest line of the grid it's set to.
    whyWrong:
      1: Snap never removes notes.
      2: It moves notes in time, it doesn't touch their volume.
      3: Only to the nearest line, not all the way back to one.

  - kind: ask
    q: How do musicians count eighth notes?
    options: ["one and two and three and four and", "one e and a", "one two three four", "one two, one two"]
    answer: 0
    why: Each beat plus an "and" halfway through.
    whyWrong:
      1: One e and a is sixteenths, four per beat.
      2: That's quarters, one per beat.
      3: That's counting in twos, not eighths.

  - kind: ask
    more: true
    q: Why might a producer turn snap off?
    options: ["to keep a looser, more human feel", "to make the song faster", "because snap only works on kicks", "to make the hats louder"]
    answer: 0
    why: Perfectly gridded drums can sound stiff. A few hits off the grid feel played by a person.
    whyWrong:
      1: Snap has nothing to do with tempo.
      2: Snap works on any notes.
      3: Snap moves timing, not volume.

  - kind: keep
    next: >-
      Next: groove and swing. Push every other sixteenth a little late and your hats start to bounce.
