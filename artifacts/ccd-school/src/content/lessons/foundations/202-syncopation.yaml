slug: syncopation
world: foundations
number: 202
title: syncopation
minutes: 5
song:
  changes: hats.hats
  why: an accent on the offbeat pulls against your kick, and that pull is what makes a beat move
learn: >-
  What syncopation is, why a hit between the beats makes people move, and an open hat accent on the offbeat
  in your own song.
youCan:
  - say what syncopation means
  - hear an accent pulling against the beat
  - put an offbeat accent in your hats
steps:
  - kind: hear
    clip: hats-offbeat
    say:
      mentor: >-
        Listen to the open hats. They don't hit with the kick, they hit in the gaps between kicks, on the
        "and". Hear how the whole loop lifts and bounces?

        That's syncopation: putting the accent, the hit that stands out, on a beat that's normally weak. The
        pulse doesn't change at all. The rhythm just leans against it.
      straight: >-
        The open hats land between the kicks, on the "and". Accenting the weak spots between beats is called
        syncopation. The pulse stays the same; the rhythm pulls against it.
      eli5: >-
        Hear the tss in between the booms? It doesn't land with the boom, it lands in the gap. That makes the
        beat bounce. Hitting in the gaps is called syncopation.

  - kind: say
    title: downbeat and offbeat
    show:
      steps: 8
      ticks: true
      rows:
        - {name: kick, sound: kick, pattern: "x.x.x.x."}
        - {name: open hat, sound: open, pattern: ".x.x.x.x"}
      marks: [{at: 0, word: downbeat}, {at: 1, word: offbeat}]
      caption: "Kick on the downbeats, open hat on the offbeats. Count it: one and two and."
    say:
      mentor: >-
        Two words first. A downbeat is a beat itself, the place where you'd say a number: one, two, three,
        four. Your kick lands on the downbeats. An offbeat is the point exactly halfway between two downbeats,
        where you'd say "and". Count "one and two and", and every "and" is an offbeat.

        Watch the picture as it plays. The kick sits under the numbers, the open hat under every "and".
        Downbeats feel solid, like feet on the ground. Offbeats feel like being in the air between steps.
      straight: >-
        Downbeat: on the beat, where you say the numbers. Offbeat: exactly halfway between two beats, the
        "and". Here the kick is on the downbeats and the open hat on the offbeats.
      eli5: >-
        When you count one, two, three, four, each number is a downbeat. Squeeze an "and" in between, one and
        two and, and each "and" is an offbeat. The boom is on the numbers. The tss is on the "ands".

  - kind: say
    title: tension and the next beat
    say:
      mentor: >-
        A hit on the offbeat creates a little tension. Your body knows where the strong beat is, and the
        accent arrives somewhere else. Then the next downbeat lands and the tension lets go. That tiny
        push and pull, over and over, is a big part of why people dance.

        A pattern with no syncopation feels square, like a march. Add even one offbeat accent and the loop
        comes alive. Funk, reggae and most dance music live on it.
      straight: >-
        An offbeat accent builds a little tension that lets go on the next downbeat. No syncopation sounds
        like a march. One offbeat hit makes it groove.
      eli5: >-
        A hit in the gap makes your body wait a tiny bit for the next boom. When the boom comes, it feels
        good. That's why it makes you want to move.
    deeper:
      - title: where it comes from
        say: >-
          Syncopation in popular music traces back to West African rhythm. Through blues, jazz, funk and
          soul it reached house and techno.

  - kind: say
    title: the backbeat is syncopation too
    show:
      steps: 4
      rows:
        - {name: kick, sound: kick, pattern: "xxxx"}
        - {name: clap, sound: clap, pattern: ".x.x", accent: ".x.x"}
      marks: [{at: 1, word: two}, {at: 3, word: four}]
      caption: "One and three are the strong beats. The clap puts its weight on two and four."
    say:
      mentor: >-
        You've already played some syncopation. In a bar of four, one and three are the strong beats, the
        ones a marching band would stamp on. Two and four are the weaker ones. Your clap lands on two and
        four, so it puts the weight exactly where a march wouldn't. That's the backbeat.

        The backbeat is a rhythm, the same way the open hats are: a pattern laid over the pulse. The kick
        holds the pulse steady, and the clap and the hats lean against it. That lean is syncopation.
      straight: >-
        One and three are the strong beats, two and four the weak ones. The clap on two and four, the
        backbeat, puts the weight on the weak beats, so it's syncopation too.
      eli5: >-
        One and three are the big steps, two and four are the little ones. Your clap goes on the little ones.
        Putting the loud sound on the little steps is a kind of syncopation, and it has a name: the backbeat.

  - kind: say
    title: anticipation
    show:
      steps: 16
      ticks: true
      rows:
        - {name: kick, sound: kick, pattern: "x...x..x....x..."}
        - {name: clap, sound: clap, pattern: "....x.......x..."}
      marks: [{at: 7, word: early}]
      caption: "The third kick moves from beat three to one sixteenth before it."
    say:
      mentor: >-
        An anticipation is a hit that comes just before a strong beat instead of on it. In the picture, the
        third kick belongs on beat three. Instead it arrives one sixteenth early, on the "a" right before
        three, and beat three itself stays empty.

        Your ear expected the kick on three and got it early, so the whole bar seems to lean forward and rush
        ahead. Funk bass lines do this all the time, and so does a lot of house bass.
      straight: >-
        An anticipation lands just before a strong beat instead of on it. Here the third kick comes a
        sixteenth early, before beat three, and the bar leans forward.
      eli5: >-
        Listen for the boom that comes too early, just before three. It's like jumping in before your turn.
        That early hit is called an anticipation, and it makes the music feel like it's rushing forward.

  - kind: say
    title: three, three, two
    show:
      steps: 8
      ticks: true
      groups: [3, 3, 2]
      rows:
        - {name: kick, sound: kick, pattern: "x..x..x.", accent: "x..x..x."}
      caption: "The eight eighths of a bar grouped 3 + 3 + 2. Count: ONE two three, ONE two three, ONE two."
    say:
      mentor: >-
        Here's a shape that's everywhere once you hear it. Take the eight eighths in a bar and, instead of
        grouping them in twos, group them three, three, two. Play a hit on the first of each group.

        Count along with the picture: ONE two three, ONE two three, ONE two. The first hit lands on beat one
        and the last on beat four. The middle one lands on the "and" after two, between the beats, and that
        one gives it the push. It feels off and inevitable at the same time. It's called the tresillo, and
        it's the backbone of a lot of Latin music, reggaeton and plenty of dance music.
      straight: >-
        Group the eight eighths of a bar as 3 + 3 + 2 and hit the first of each group: beat one, the "and"
        of two, beat four. The middle hit, between the beats, gives it the push.
      eli5: >-
        Count to eight but in groups: ONE two three, ONE two three, ONE two. Clap on every big ONE. Two claps
        land on numbers, and the one in the middle lands in a gap, which makes it bounce.

  - kind: imagine
    why: >-
      Reading a beat before you hear it trains you to feel the push of an off-beat kick.
    layer: drums
    pattern: {kick: "x..x..x...x.....", clap: "....x.......x..."}
    say:
      mentor: >-
        A beat on the grid, no sound. The clap is on two and four, but the kick isn't on the beats: it lands
        in between, pushing ahead. Tap it on your leg as the playhead passes. Then play the beats and pick the
        one you saw.
      straight: >-
        Read the beat, tap it out, then pick the matching one. The kick is syncopated, off the beat.
      eli5: >-
        Look where the kicks are: not on the counts, but in between. Tap it on your knee, then pick the beat
        that sounds the same.
    hint: "Say the counts out loud, one e and a. The second kick comes before beat two."

  - kind: play
    why: >-
      An accent off the beat gives your groove a lift that straight hits can't.
    layer: hats
    surface: pads
    snap: true
    goal: {notes: 2}
    say:
      mentor: >-
        Put an accent in your own hats. Your closed hats keep going; you're adding the open hat on top.

        Press rec, wait out the count-in, and tap the open hat on two of the "ands", the gaps halfway between
        kicks. Snap is on and set to eighths, so each hit lands right in the gap. Try the "and" after two and
        the "and" after four, or put them wherever the loop lifts most.
      straight: >-
        Add open hats on top of your closed hats. Rec, count-in, then tap the open hat on two of the "ands".
        Snap puts them exactly between the kicks.
      eli5: >-
        Press rec and wait for four ticks. Then tap the open hat pad in the gaps between the booms, two times.
        Listen to it bounce.
    hint: Count "one and two and" and tap the open hat on an "and".

  - kind: ask
    q: "Hear a straight beat, then a syncopated one. Syncopation means:"
    part: drums
    play: [{notes: {kick: "x...x...x...x...", clap: "....x.......x...", hat: "x.x.x.x.x.x.x.x."}, label: "straight"}, {notes: {kick: "x..x..x...x..x..", clap: "....x.......x...", hat: "..x...x...x...x."}, label: "syncopated"}]
    options: ["accenting the offbeats and weak beats", "playing only on the main beats", "changing the time signature", "slowing the tempo down"]
    answer: 0
    why: Syncopation puts the accent where the beat is normally weak, between or off the strong beats.
    whyWrong:
      1: That's the opposite. Only main beats sounds square.
      2: The bar stays the same. The accents move.
      3: The tempo doesn't change.

  - kind: ask
    q: In 4/4, the backbeat lands on
    options: ["beats two and four", "beats one and three", "every beat", "only the ands"]
    answer: 0
    why: Two and four, where the clap or snare usually sits.
    whyWrong:
      1: One and three are the strong beats, usually the kick's.
      2: Every beat is the pulse, not the backbeat.
      3: The ands are offbeats. The backbeat is on two and four.

  - kind: ask
    q: Why does an offbeat accent make people move?
    options: ["it builds tension that lets go on the next beat", "it makes the song louder", "it speeds up the tempo", "it changes the key"]
    answer: 0
    why: The accent arrives where you don't expect it, and the next downbeat resolves it.
    whyWrong:
      1: It can be quiet and still work.
      2: The tempo stays the same.
      3: Rhythm doesn't touch the key.

  - kind: ask
    more: true
    q: Hear a beat where everything is off the beat and nothing marks the one. What happens?
    part: drums
    play: {notes: {kick: "...x..x....x..x.", clap: "..x.......x....."}}
    options: ["listeners lose the pulse", "the groove gets tighter", "the tempo doubles", "nothing changes"]
    answer: 0
    why: Syncopation needs a steady pulse to pull against. Without one, people lose their place.
    whyWrong:
      1: It gets looser and harder to follow.
      2: Tempo stays the same.
      3: Losing the one changes everything.

  - kind: keep
    next: >-
      Back to the beat path. Next: groove and swing, and a swing setting for your whole song.
