slug: syncopation
world: foundations
number: 202
title: syncopation
minutes: 5
song:
  changes: hats.hats
  why: an accent on the offbeat pulls against your kick, and that pull is what makes a beat move
learn: >-
  What syncopation is, why a hit between the beats makes people move, and an open hat accent on the offbeat
  in your own song.
youCan:
  - say what syncopation means
  - hear an accent pulling against the beat
  - put an offbeat accent in your hats
steps:
  - kind: hear
    clip: hats-offbeat
    say:
      mentor: >-
        Listen to the open hats. They don't hit with the kick, they hit in the gaps between kicks, on the
        "and". Hear how the whole loop lifts and bounces?

        That's syncopation: putting the accent, the hit that stands out, on a beat that's normally weak. The
        pulse doesn't change at all. The rhythm just leans against it.
      straight: >-
        The open hats land between the kicks, on the "and". Accenting the weak spots between beats is called
        syncopation. The pulse stays the same; the rhythm pulls against it.
      eli5: >-
        Hear the tss in between the booms? It doesn't land with the boom, it lands in the gap. That makes the
        beat bounce. Hitting in the gaps is called syncopation.

  - kind: say
    title: tension and the next beat
    say:
      mentor: >-
        A hit on the offbeat creates a little tension. Your body knows where the strong beat is, and the
        accent arrives somewhere else. Then the next downbeat lands and the tension lets go. That tiny
        push and pull, over and over, is a big part of why people dance.

        A pattern with no syncopation feels square, like a march. Add even one offbeat accent and the loop
        comes alive. Funk, reggae and most dance music live on it.
      straight: >-
        An offbeat accent builds a little tension that lets go on the next downbeat. No syncopation sounds
        like a march. One offbeat hit makes it groove.
      eli5: >-
        A hit in the gap makes your body wait a tiny bit for the next boom. When the boom comes, it feels
        good. That's why it makes you want to move.
    deeper:
      - title: the backbeat and the anticipation
        say: >-
          The clap on two and four is already a kind of syncopation, called the backbeat: the accent sits on
          the weaker beats instead of one and three. An anticipation is a hit just before a strong beat,
          arriving early so the music feels like it's rushing forward. Funk bass lines use it all the time.
      - title: three, three, two
        say: >-
          Split the eight eighths of a bar into groups of three, three and two and accent the first of each
          group. It feels off and inevitable at the same time. It's the shape of a lot of Latin rhythm and
          plenty of dance music.
      - title: where it comes from
        say: >-
          Syncopation in popular music traces back to West African rhythm. Through blues, jazz, funk and
          soul it reached house and techno.

  - kind: imagine
    layer: drums
    pattern: {kick: "x..x..x...x.....", clap: "....x.......x..."}
    say:
      mentor: >-
        A beat on the grid, no sound. The clap is on two and four, but the kick isn't on the beats: it lands
        in between, pushing ahead. Tap it on your leg as the playhead passes. Then play the beats and pick the
        one you saw.
      straight: >-
        Read the beat, tap it out, then pick the matching one. The kick is syncopated, off the beat.
      eli5: >-
        Look where the kicks are: not on the counts, but in between. Tap it on your knee, then pick the beat
        that sounds the same.
    hint: "Say the counts out loud, one e and a. The second kick comes before beat two."

  - kind: play
    layer: hats
    surface: pads
    snap: true
    goal: {notes: 2}
    say:
      mentor: >-
        Put an accent in your own hats. Your closed hats keep going; you're adding the open hat on top.

        Press rec, wait out the count-in, and tap the open hat on two of the "ands", the gaps halfway between
        kicks. Snap is on and set to eighths, so each hit lands right in the gap. Try the "and" after two and
        the "and" after four, or put them wherever the loop lifts most.
      straight: >-
        Add open hats on top of your closed hats. Rec, count-in, then tap the open hat on two of the "ands".
        Snap puts them exactly between the kicks.
      eli5: >-
        Press rec and wait for four ticks. Then tap the open hat pad in the gaps between the booms, two times.
        Listen to it bounce.
    hint: Count "one and two and" and tap the open hat on an "and".

  - kind: ask
    q: "Hear a straight beat, then a syncopated one. Syncopation means:"
    part: drums
    play: [{notes: {kick: "x...x...x...x...", clap: "....x.......x...", hat: "x.x.x.x.x.x.x.x."}, label: "straight"}, {notes: {kick: "x..x..x...x..x..", clap: "....x.......x...", hat: "..x...x...x...x."}, label: "syncopated"}]
    options: ["accenting the offbeats and weak beats", "playing only on the main beats", "changing the time signature", "slowing the tempo down"]
    answer: 0
    why: Syncopation puts the accent where the beat is normally weak, between or off the strong beats.
    whyWrong:
      1: That's the opposite. Only main beats sounds square.
      2: The bar stays the same. The accents move.
      3: The tempo doesn't change.

  - kind: ask
    q: In 4/4, the backbeat lands on
    options: ["beats two and four", "beats one and three", "every beat", "only the ands"]
    answer: 0
    why: Two and four, where the clap or snare usually sits.
    whyWrong:
      1: One and three are the strong beats, usually the kick's.
      2: Every beat is the pulse, not the backbeat.
      3: The ands are offbeats. The backbeat is on two and four.

  - kind: ask
    q: Why does an offbeat accent make people move?
    options: ["it builds tension that lets go on the next beat", "it makes the song louder", "it speeds up the tempo", "it changes the key"]
    answer: 0
    why: The accent arrives where you don't expect it, and the next downbeat resolves it.
    whyWrong:
      1: It can be quiet and still work.
      2: The tempo stays the same.
      3: Rhythm doesn't touch the key.

  - kind: ask
    more: true
    q: Hear a beat where everything is off the beat and nothing marks the one. What happens?
    part: drums
    play: {notes: {kick: "...x..x....x..x.", clap: "..x.......x....."}}
    options: ["listeners lose the pulse", "the groove gets tighter", "the tempo doubles", "nothing changes"]
    answer: 0
    why: Syncopation needs a steady pulse to pull against. Without one, people lose their place.
    whyWrong:
      1: It gets looser and harder to follow.
      2: Tempo stays the same.
      3: Losing the one changes everything.

  - kind: keep
    next: >-
      Back to the beat path. Next: groove and swing, and a swing setting for your whole song.
