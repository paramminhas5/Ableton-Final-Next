slug: finish-export
world: producer
number: 20
title: finish and export
minutes: 5
song:
  changes: drums.kick
  why: a song is finished when it leaves the app
learn: >-
  Naming your song, exporting it as audio at the right loudness and as midi for Ableton Live, and what happens next.
youCan:
  - export your song as audio at -14 lufs for streaming, or louder for clubs
  - export your song as midi
  - open it in Live and keep working
  - say what stems are
steps:
  - kind: say
    title: done is a skill
    say:
      mentor: >-
        Lots of producers have hundreds of loops and no finished songs. Finishing is a skill, and you've just
        done it: a beat, a bass, a lead, chords, a mix and an arrangement, all yours.

        From here you can take it into Ableton Live to keep going: more sounds, vocals, a proper master. You
        export it as midi, the notes of every part, and Live plays them on its own instruments.
      straight: >-
        Finishing matters. Export your song as midi and open it in Live to keep going.
      eli5: >-
        You made a whole song! Now you can take it into a big music program called Ableton Live.
    deeper:
      - title: stems
        say: >-
          Stems are each part exported as its own audio file: drums, bass, lead and so on. Engineers and djs
          use them to remix and master. They're coming to CCD School soon.

  - kind: arrange
    why: >-
      A finished song is one you can take out and play anywhere. This is where it leaves the app.
    goal: export
    say:
      mentor: >-
        Here's your finished song. Give it a name and play it through once more. Then take it out two ways.
        Audio for streaming saves a wav at -14 lufs, the loudness the big streaming services turn songs to, so
        yours sounds the same there as here; loud for clubs pushes it to -9, with the peaks held under -1 dbtp
        either way. Midi for Live drops every part onto its own track to keep working. And if you're proud of
        it, send it to CCD: the best learner tracks get played at our nights.
      straight: >-
        Name it, play it, download the audio (-14 lufs, or -9 for clubs) and the midi for Live. Send it to CCD if
        you're proud of it.
      eli5: >-
        Type a name for your song. Then save it as audio to play anywhere, or as midi to open in Live.

  - kind: ask
    q: What does a midi file hold?
    options: ["the notes of every part", "the finished audio", "only the drums", "the song's artwork"]
    answer: 0
    why: Midi is notes, timing and velocity. Live plays them on its instruments.
    whyWrong:
      1: That's an audio export.
      2: It holds every part.
      3: It's music data only.

  - kind: keep
    next: >-
      Next: the dj world. Play your own song out, with other tracks, like at a CCD night.
