slug: bass-poli
world: producer
number: 210
title: bass and poli
minutes: 5
song:
  changes: bass.bass
  why: a thicker bass voice gives your low end weight and character without adding a single note
learn: >-
  What makes a bass sound thick: a sub underneath, the shape on top, and a little drift, and the two Live
  instruments built for bass and for chords.
youCan:
  - say what a sub oscillator adds to a bass
  - make your bass thicker without changing its notes
  - say what Live's Bass and Poli are for
steps:
  - kind: hear
    clip: synth-shapes
    say:
      mentor: >-
        A soft wave, a saw and a square. Your bass is built from these too. Under the hood it has two
        oscillators, one making a saw and one a square, plus a third one playing a sine wave an octave below
        your notes. That low one is called a sub oscillator, the sub for short.

        The sub is the weight you feel in your chest. The saw and square on top are the character you hear.
      straight: >-
        Your bass has a saw and a square on top and a sine sub an octave below. Sub is weight, the top is
        character.
      eli5: >-
        Your bass is made of a few waves. A deep, smooth one underneath gives the rumble. Brighter ones on top
        give it its sound.

  - kind: shape
    why: >-
      A thicker bass fills the low end without changing a single note.
    layer: bass
    knobs: [sub, wave, drift, character]
    say:
      mentor: >-
        Here's your song, with four knobs that thicken your bass without touching its notes. Sub turns up the
        sine an octave below: more weight, more rumble. Shape blends the top from saw to square, bright and
        buzzy to hollow and round. Live's Drift calls this knob shape too.

        Drift is the subtle one. It lets the pitch wander a few cents, slowly and at random, like an old
        analogue synth warming up. A little makes the bass feel alive instead of perfect.

        Circuit picks how the filter sounds, with the names Live's Auto Filter uses. Prd is the classic
        four-pole ladder: round, and it gives up a little bass when you push the resonance. Ms2 is a two-pole
        filter that saturates as it resonates, the sound of acid and rave. Svf is a clean two-pole state
        variable filter: softer slope, sweet resonance. Keep the bass that fills your song best.
      straight: >-
        Sub is weight, an octave down. Shape moves the top from saw to square. Drift lets the pitch wander a
        few cents, like analogue. Circuit: prd, ms2 or svf, as in Live's Auto Filter. Keep the thickest bass that still sounds clean.
      eli5: >-
        Sub makes the rumble bigger. Shape changes the buzzy part. Drift makes it wobble a tiny bit, like an old
        synth. Circuit changes how the bass growls. Keep the one you like.

  - kind: say
    title: bass and poli in live
    say:
      mentor: >-
        Live has two instruments named for exactly these jobs. Bass is made for single-note bass lines. Poli,
        short for polyphonic, plays many notes at once, so it suits chords, pads and keys.

        Both are built to sound good fast: load a preset, play, turn a few knobs. When you want to go deeper,
        Wavetable and Operator give you every control.
      straight: >-
        Live's Bass is for bass lines. Poli is polyphonic, for chords, pads and keys. Quick to get a sound;
        Wavetable and Operator go deeper.
      eli5: >-
        Live has a synth called Bass for bass lines and one called Poli for chords. They're quick to use. Other
        synths let you go further.
    deeper:
      - title: mono and poly
        say: >-
          A monophonic synth plays one note at a time. Play a new note and the old one stops, which suits a bass
          line and lets notes slide into each other. A polyphonic synth plays several at once, which chords
          need. Your bass here is monophonic, and its glide knob slides between notes when they overlap.

  - kind: match
    why: >-
      Low weight is felt more than heard. This trains your ear to notice it.
    layer: bass
    knobs: [sub]
    target: {sub: 0.8}
    say:
      mentor: >-
        Match the weight by ear. The target is your bass with the sub turned up: a sine an octave under your
        notes, the deep weight you feel more than hear. Switch between them and turn sub until yours has the
        same weight underneath.
      straight: >-
        Match the target's sub level. The sub is a sine an octave below your notes, the weight under the bass.
      eli5: >-
        The target has a deep rumble under it. Turn sub until yours rumbles the same.
    hint: "Listen low down. More rumble underneath means more sub."

  - kind: ask
    q: Hear your bass with no drift, then with lots. What does drift do?
    part: bass
    play: [{drift: 0, label: "no drift"}, {drift: 1, label: "drift up"}]
    options: ["lets the pitch wander a few cents, like analogue", "makes it louder", "adds new notes", "cuts the low end"]
    answer: 0
    why: Drift is a slow, random pitch wobble of a few cents, the imperfection of an old analogue synth.
    whyWrong:
      1: Loudness is level.
      2: Your notes stay the same.
      3: The low end stays, drift only moves pitch slightly.

  - kind: ask
    q: Why is Poli the better pick for chords?
    options: ["it's polyphonic, so it plays many notes at once", "it's louder", "it only plays low notes", "it plays one note at a time"]
    answer: 0
    why: Polyphonic means several notes at once, which a chord needs.
    whyWrong:
      1: Loudness isn't the difference.
      2: It plays across the whole range.
      3: That's monophonic, like a bass synth.

  - kind: keep
    next: >-
      Back to your song: next, a second kind of synth for your lead.
