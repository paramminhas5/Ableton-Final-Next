slug: fills
world: producer
number: 18
title: variation and fills
minutes: 5
song:
  changes: drums.kick
  why: a fill signals that something is about to change
learn: >-
  What a fill is, where it goes, and fills at the ends of your sections.
youCan:
  - say what a fill does
  - place fills at section ends
  - hear how a fill sets up a change
steps:
  - kind: hear
    clip: kick-and-clap
    say:
      mentor: >-
        A drummer playing the same beat for four minutes still tells you when something's coming: a roll on
        the snare at the end of a section. That's a fill. In dance music it might be a snare roll, the kick
        dropping out for a beat, or a burst of hats. Whatever it is, it says: change ahead.
      straight: >-
        A fill is a short variation, often the last beat or bar of a section, that signals a change.
      eli5: >-
        A fill is a little drum roll at the end of a part that says, get ready, something new is coming!

  - kind: arrange
    why: >-
      A fill tells the listener something is about to change, so the next section lands.
    goal: fills
    say:
      mentor: >-
        Your arrangement has a fill row. Tap fill on a section and its last beat drops the kick for a quick
        snare roll. Put fills before the drop and the break and listen to how they lead you in.
      straight: >-
        Tap fill on sections that lead into a change. The last beat becomes a snare roll.
      eli5: >-
        Tap fill on the part before the drop. Listen to the drum roll.

  - kind: tempo
    why: >-
      A hit that only plays some of the time makes a loop feel less repeated.
    set: chance
    layer: hats
    say:
      mentor: >-
        A fill can also live inside the loop. Pick a step on your hats and give it a condition. 1:2 plays it
        every second time round the loop, 1:4 every fourth: that is an Elektron trig condition, and the beat
        changes a little each pass without you writing a second pattern. Or turn its chance down, Live 12's
        name for it: at 50% it plays about half the time. Fill plays the step only while you hold the fill
        key, the way Elektron drummers throw in a roll.

        Same control elsewhere: Live 12 calls it chance in the note editor, Elektron calls them trig
        conditions and probability.
      straight: >-
        Pick a hat step. 1:2 plays it every second loop, 1:4 every fourth (Elektron's trig conditions). Chance
        (Live 12) plays it some of the time. Fill plays it only while the fill key is held.
      eli5: >-
        Pick a step. Make it play only sometimes. Your beat changes a little every time round.

  - kind: ask
    q: Hear two bars with a fill at the end. What does the fill tell the listener?
    part: drums
    play: {notes: {kick: "x...x...x...x...x...x...x...xxxx", clap: "....x.......x.......x...x.x.xxxx"}}
    options: ["a change is coming", "the song is over", "the tempo is changing", "nothing at all"]
    answer: 0
    why: It's a signal that the next section is about to start.
    whyWrong:
      1: It leads into something.
      2: Tempo stays the same.
      3: It's one of the clearest signals in music.

  - kind: keep
    next: >-
      Next: the breakdown and the drop, the biggest moment in your track.
