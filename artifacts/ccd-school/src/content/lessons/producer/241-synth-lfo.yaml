slug: synth-lfo
world: producer
number: 241
title: the lfo
minutes: 5
song:
  changes: lead.lead
  why: a filter that sweeps open and closed in time makes your lead move instead of sitting still
learn: >-
  What an lfo is, what rate and depth do, and a slow sweep on your lead's filter, done by hand the way an lfo
  would do it.
youCan:
  - say what an lfo is
  - say what rate and depth control
  - say what an lfo on pitch, filter or volume sounds like
steps:
  - kind: hear
    clip: synth-pitch
    say:
      mentor: >-
        A low note, then a high one. Pitch is how fast a wave wiggles: hundreds of times a second for these
        notes. Slow a wave right down, below about 20 times a second, and you can't hear it as a note anymore.

        But a wave that slow is still useful. Hook it up to a knob and it turns that knob up and down for you,
        over and over. That's an lfo, a low frequency oscillator: a wave too slow to hear, used to move things.
      straight: >-
        Notes are fast waves. A wave slower than about 20 a second isn't heard as a note. An lfo, low frequency
        oscillator, is a slow wave used to move a knob up and down by itself.
      eli5: >-
        A really, really slow wiggle is too slow to hear. But it can turn a knob up and down for you, again and
        again. That's an lfo.

  - kind: say
    title: rate, depth, destination
    say:
      mentor: >-
        Rate is how fast the lfo goes round. Depth is how far it moves the knob. And the destination is which
        knob it moves.

        Each destination has its own sound. An lfo on pitch is vibrato, the wobble a singer puts on a long
        note. On the filter it's a wah, the brightness opening and closing. On volume it's tremolo, a pulsing
        up and down.

        Most lfos can sync to the tempo, so the movement locks to your beat: once a bar, once a beat, and so on.
      straight: >-
        Rate is speed, depth is how far, destination is which knob. Lfo on pitch is vibrato, on the filter a
        wah, on volume tremolo. Tempo sync locks it to your beat.
      eli5: >-
        You choose how fast it wobbles and how much. Wobble the pitch and it goes wee-oo-wee. Wobble the
        brightness and it goes wah-wah.
    deeper:
      - title: the lfo shape
        say: >-
          The lfo's wave shape sets the feel. A sine moves smoothly. A square jumps between two values. Sample
          and hold jumps to a random value each step, which gives that bubbling, computer-ish movement.
      - title: lfos in live
        say: >-
          Wavetable has two lfos. You connect them in its modulation matrix, at the bottom of the device, by
          picking a source and a destination and setting an amount.

  - kind: shape
    why: >-
      An lfo moves a sound on its own, so it never sits still.
    layer: lead
    knobs: [lfo, lforate, lfoto, cutoff]
    say:
      mentor: >-
        Your lead now has an lfo of its own. Your song is playing. Turn lfo up and hear the filter start to breathe on its own, opening and closing without you touching anything.
        
        lfo rate is how fast it swings. Slow is a tide, fast is a wobble. lfo to sends it somewhere else: to the pitch for vibrato, to the volume for tremolo. Set cutoff where the sweep sits best over your bass. Leave the lfo where your lead sounds alive, or at zero if you like it still.
      straight: >-
        Turn lfo up and the filter moves by itself. lfo rate sets the speed, lfo to picks filter, pitch or volume. Leave it where it sounds good.
      eli5: >-
        Turn lfo up. A little robot now wiggles the knob for you. Rate is how fast it wiggles.

  - kind: match
    why: >-
      Hearing how much and how fast something moves is how you'll copy movement from other tracks.
    layer: lead
    knobs: [lfo, lforate]
    target: {lfo: 0.5, lforate: 0.25}
    say: >-
      Match the movement by ear: how much the lfo moves the sound, and how fast.
    hint: "Count the wobbles in a bar for the rate, then set how deep they go."

  - kind: ask
    q: What does lfo stand for?
    options: ["low frequency oscillator", "loud filter output", "left fader offset", "long fade out"]
    answer: 0
    why: An oscillator so slow you don't hear it as a note, used to move other knobs.
    whyWrong:
      1: Not a filter or an output.
      2: Not a fader.
      3: Not a fade.

  - kind: ask
    q: Hear an lfo move your lead's pitch up and down. What do you hear?
    part: lead
    play: {lfo: 0.5, lfoto: 0.5, lforate: 0.82}
    options: ["vibrato", "tremolo", "a wah", "reverb"]
    answer: 0
    why: Pitch wobbling up and down is vibrato.
    whyWrong:
      1: Tremolo is volume moving.
      2: A wah is the filter moving.
      3: Reverb is space.

  - kind: ask
    q: Hear the lfo on your lead's cutoff with the rate low, then high. What does the rate set?
    part: lead
    play: [{lfo: 0.6, lfoto: 0, lforate: 0.2, label: "rate low"}, {lfo: 0.6, lfoto: 0, lforate: 0.8, label: "rate high"}]
    options: ["how fast it moves", "how far it moves", "which knob it moves", "how loud the lead is"]
    answer: 0
    why: Rate is speed. Depth is how far.
    whyWrong:
      1: That's depth.
      2: That's the destination.
      3: Level is separate.

  - kind: keep
    next: >-
      Back to your song path, or try modulation routing to send movement somewhere else.
