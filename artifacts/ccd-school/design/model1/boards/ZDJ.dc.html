 box-shadow:0 0 0 1.5px #000,inset 0 0 0 1px rgba(255,255,255,.04),inset 0 10px 22px rgba(0,0,0,.75),inset 0 -6px 14px rgba(0,0,0,.5)!important}
.scrf:after{background:linear-gradient(115deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 30%,rgba(255,255,255,0) 31%),radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.05),transparent 60%)!important}
/* selected pad: backlight shines through */
.sp.lit{background:radial-gradient(78% 72% at 50% 50%,color-mix(in srgb,var(--c) 34%,#fff) 0,var(--c) 56%,color-mix(in srgb,var(--c) 80%,#000) 100%)!important;transform:none;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.14),0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent),0 0 14px color-mix(in srgb,var(--c) 55%,transparent),0 0 30px color-mix(in srgb,var(--c) 25%,transparent)!important}
/* attention: a soft glow from below, used only to point at something */
.sp.dim{background:radial-gradient(55% 52% at 50% 55%,color-mix(in srgb,var(--c) 40%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 72%,transparent 100%),linear-gradient(180deg,var(--spa),var(--spb))!important}
.sp.on{color:#141416;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 88%,#000))!important;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 0 -3px 0 rgba(0,0,0,.14),inset 0 0 0 1px rgba(0,0,0,.12),0 1px 0 rgba(0,0,0,.25)!important}
.sp:not(.lit):not(.on):hover{background:radial-gradient(55% 52% at 50% 55%,color-mix(in srgb,var(--c,#F3F2EF) 40%,transparent),color-mix(in srgb,var(--c,#F3F2EF) 8%,transparent) 72%,transparent 100%),linear-gradient(180deg,var(--spa),var(--spb))!important}
.sp .pic{position:absolute;left:12px;top:12px}
.sp .lv{position:absolute;right:12px;top:12px;font-size:10px;font-weight:600;opacity:.5}
.sp .tg{position:absolute;right:12px;top:11px;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 6px;border-radius:5px;border:1px solid currentColor;opacity:.75}
.vk{height:46px;border-radius:11px;justify-content:center;gap:8px;font-size:13px;font-weight:500;color:var(--sub)}
.vk.on{color:var(--ink);font-weight:600}
.vk .dot{position:static;margin:0}

/* drum rack at rest: every pad faintly lit in its colour */
.sp.rest{background:radial-gradient(70% 65% at 50% 55%,color-mix(in srgb,var(--c) 22%,transparent),color-mix(in srgb,var(--c) 6%,transparent) 80%),linear-gradient(180deg,var(--spa),var(--spb))!important}
/* ripple from a hit: neighbours light up and fade with distance */
.sp.rip1{background:radial-gradient(75% 70% at 50% 52%,color-mix(in srgb,var(--c) 62%,transparent),color-mix(in srgb,var(--c) 22%,transparent) 85%),linear-gradient(180deg,var(--spa),var(--spb))!important;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),0 0 10px color-mix(in srgb,var(--c) 30%,transparent)!important}
.sp.rip2{background:radial-gradient(75% 70% at 50% 52%,color-mix(in srgb,var(--c) 38%,transparent),color-mix(in srgb,var(--c) 12%,transparent) 85%),linear-gradient(180deg,var(--spa),var(--spb))!important}
.sp.done{opacity:.62}
.dk .kcap.hit{background:linear-gradient(180deg,#8FF0D2,#36C9A0)!important;box-shadow:inset 0 2px 1px rgba(255,255,255,.45),0 1px 0 #1E8F70,0 2px 0 #1E8F70,0 3px 0 #156B54,0 4px 0 #156B54,0 8px 10px -2px var(--shA)!important}
.lyr{height:48px;border-radius:12px;flex-direction:column;justify-content:center;gap:5px;font-size:12px;font-weight:500;color:var(--sub)}
.lyr.on{color:var(--ink);font-weight:600}
.lyr .dash{width:22px}

.bank{display:flex;height:30px;border-radius:15px;background:var(--well);box-shadow:inset 0 3px 6px var(--shA),0 1px 0 var(--hi);padding:3px;box-sizing:border-box;flex:none}
.bank span{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--sub);border-radius:12px}
.bank span.on{color:var(--ink);background:linear-gradient(180deg,var(--c1),var(--c0));box-shadow:inset 0 1.5px 0 var(--hi),0 1px 0 var(--cs1),0 2px 0 var(--cs2),0 4px 5px -1px var(--shA)}

.mini{height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}

.slot{height:50px;border-radius:11px;flex-direction:column;justify-content:center;gap:6px;font-size:10px;font-weight:500;color:var(--sub);padding:0}
.slot.on{color:var(--ink);font-weight:600}
.slot .dash{width:16px}
.slot.empty{color:var(--print);opacity:.75}
.mode{display:flex;height:34px;width:150px;border-radius:17px;background:var(--well);box-shadow:inset 0 3px 6px var(--shA),0 1px 0 var(--hi);padding:3px;box-sizing:border-box}
.mode span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:var(--sub);border-radius:14px}
.mode span.on{color:var(--ink);font-weight:600;background:linear-gradient(180deg,var(--c1),var(--c0));box-shadow:inset 0 1.5px 0 var(--hi),0 1px 0 var(--cs1),0 2px 0 var(--cs2),0 4px 5px -1px var(--shA)}
.ms{width:34px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;border:1px solid #3A3A40;font-size:11px;font-weight:500;color:#F3F2EF}
.chip.on{border-color:currentColor}
.rib{position:relative;border-radius:14px;background:linear-gradient(180deg,#1A1A1D,#0E0E10);box-shadow:inset 0 3px 8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.04),0 1px 0 var(--hi)}

.stage{position:relative;border-radius:16px;background:radial-gradient(90% 70% at 50% 100%,#17171A,#09090A 75%);box-shadow:inset 0 4px 12px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.04),0 1px 0 var(--hi);overflow:hidden}
